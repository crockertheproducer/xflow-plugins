# Publica la carpeta web/ en GitHub Pages como laboratorio de pruebas.
# En GitHub Pages no hay PHP: la tienda y el panel arrancan solos en "modo laboratorio"
# (datos de ejemplo guardados en el navegador, pagos simulados).
name: Laboratorio en GitHub Pages

on:
  push:
    branches: [main, claude/elegant-bohr-97munf]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar sitio (sin archivos del servidor)
        run: |
          mkdir -p _site
          cp -r web/. _site/
          rm -f _site/api/config.php
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
